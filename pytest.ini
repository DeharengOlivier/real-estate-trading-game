[pytest]
# Run the API test suite with no external services.
# MongoDB is mocked via mongomock-motor and Redis via fakeredis (see
# api/tests/conftest.py), so `pytest` works against in-memory backends only.
testpaths = api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
# Later entries win, so the general rule comes first and the exception after.
filterwarnings =
    # Third-party deprecations are not enforced: they are not this project's to
    # fix, and a build that fails on somebody else's release schedule stops
    # being a signal.
    ignore::DeprecationWarning
    # This one is. datetime.utcnow() returns a naive datetime that claims to be
    # UTC, and it is scheduled for removal, so calling it is a scheduled break.
    # An error here means it cannot come back unnoticed.
    error:.*utcnow.*:DeprecationWarning
