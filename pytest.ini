[pytest]
# Run the API test suite with no external services.
# MongoDB is mocked via mongomock-motor and Redis via fakeredis (see
# api/tests/conftest.py), so `pytest` works against in-memory backends only.
testpaths = api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
filterwarnings =
    ignore::DeprecationWarning
