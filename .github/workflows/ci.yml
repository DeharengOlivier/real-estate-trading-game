name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A dependency that was clean on merge day is not clean forever.
  schedule:
    - cron: "0 6 * * 1"

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what the images run; the ceiling is what a fresh
        # checkout would pick up. The pins have to install on both.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: pytest
        env:
          # The API refuses to start without a real key, which is the point of
          # the check. This one is generated per run and never leaves it.
          SECRET_KEY: ci-only-signing-key-not-used-outside-this-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: pytest -q

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: pip-audit
        # Audits what is installed, which is what the images ship, rather than
        # re-resolving the requirement files into a throwaway environment.
        run: pip-audit --strict

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=moderate

  ui:
    name: Frontend builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        working-directory: ui
        run: npm ci
      - name: build
        working-directory: ui
        run: npm run build

  images:
    name: Images build and the stack comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refuse to start without a signing key
        run: |
          # The compose file uses ${SECRET_KEY:?}, so this must fail.
          if docker compose config >/dev/null 2>&1; then
            echo "compose accepted a missing SECRET_KEY" >&2
            exit 1
          fi
          echo "compose refused a missing SECRET_KEY, as intended"
      - name: Start the stack
        env:
          SECRET_KEY: ci-only-signing-key-not-used-outside-this-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose up --build --detach --wait --wait-timeout 300
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - name: Smoke test the running stack
        # The suite runs on mongomock. This runs the same invariants against a
        # real MongoDB, where the conditional writes that decide who gets a
        # property actually have to hold.
        run: python -m scripts.smoke http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
